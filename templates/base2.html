<!doctype html>
{% load i18n %}
{% load blog_tags %}
{% load static %}
{% load meta %}
{% load pwa %} 

<html lang="{{ LANGUAGE_CODE|default:'en' }}" prefix="og: https://ogp.me/ns#" dir="{% trans 'dir' %}">
  {% progressive_web_app_meta %} 
  <head>
    {{ meta_namespaces }}
    {% include 'meta/meta.html' %}
    <title>{% block title %}{{ seo_site_name }}{% endblock %}</title>
    <meta name="description" content="{{ seo_default_description }}">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="{{ seo_canonical }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ seo_site_name }}">
    <meta property="og:url" content="{{ seo_canonical }}">
    <meta property="og:title" content="{{ seo_site_name }}">
    <meta property="og:description" content="{{ seo_default_description }}">
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'img/iloveicon512x512.png' %}">
    <meta name="twitter:card" content="summary">
    <link rel="alternate" hreflang="{{ LANGUAGE_CODE|default:'en' }}" href="{{ seo_canonical }}">
    <link rel="alternate" hreflang="x-default" href="{{ seo_canonical }}">

    {% block meta %} {% endblock%}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link href="/static/css/main.css" rel="stylesheet">
    <link href="{% static 'css/responsive.css' %}" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon.png">

  </head>
  <body class="text-center bg-body-secondary tool-include-shell">

    {% block content %}{% endblock %}

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="{% static 'js/main.js' %}" defer></script>
  </body>
</html>
